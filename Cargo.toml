[package]
name = "goose-readline"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "Readline-style terminal client for the goose agent (ACP), Rust rewrite of kilo-readline"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
agent-client-protocol = { version = "2.2.0", default-features = false }
goose = { path = "../goose/crates/goose", default-features = false, features = ["rustls-tls", "online-model-meta"] }

[profile.release]
lto = "thin"
